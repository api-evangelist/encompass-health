  - name: Partner / Contract Limit
    scope: contract
    metric: varies
    limit: see partner agreement
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter and honor the Retry-After header
      when present.
  - name: Contractual Scoping
    description: Rate limits are negotiated as part of the partner integration contract rather than published
      publicly.

    - Usage
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Encompass Health API
  ServiceCategory: Healthcare Integration
  ProviderName: Encompass Health
  PublisherName: Encompass Health Corporation
  InvoiceIssuerName: Encompass Health Corporation
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - partner
  - name: contract_fee
    unit: month
    aggregation: sum
    dimensions:
      - partner
principles:
  - name: Visibility
    description: Consumption visibility is delivered through partner reporting cadences agreed in the contract;
      there is no public usage API.
  - name: Allocation
    description: Allocate cost by partner agreement, business unit, and integration use case as defined
      in the master services agreement.
  - name: Optimization
    description: Optimization levers are batching, caching, and renegotiating contract terms at renewal;
      no public discount programs are documented.
  - name: Accountability
    description: The contracting business unit owns the spend; reviews follow the contract cadence with
      the Encompass Health account team.

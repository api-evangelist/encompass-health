description: FOCUS-aligned FinOps placeholder for Encompass Health. The company does not publish public
  API pricing; FinOps integration would be defined under the partner contract and invoiced by the operating
  entity.
notes: No public billing or usage API was located. Meters and billing model below are scaffold values;
  reconcile against a signed partner agreement before relying on them.
sources:
  - https://www.encompasshealth.com
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
